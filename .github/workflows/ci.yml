name: Validate Compose knowledge
on:
  push:
    branches-ignore: [corpus]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install retrieval evaluation dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
          rg --version
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: node scripts/evaluate.mjs .cache/ci-evaluation
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: retrieval-evaluation
          path: .cache/ci-evaluation
          include-hidden-files: true
          if-no-files-found: ignore

name: Validate Compose knowledge
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: node scripts/evaluate.mjs .cache/ci-evaluation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-evaluation
          path: .cache/ci-evaluation
          include-hidden-files: true
          if-no-files-found: ignore
